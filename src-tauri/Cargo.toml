[package]
name = "mibl-launcher"
version = "2.5.0"
description = "Mibl Launcher — локальный лаунчер Minecraft"
authors = ["Mibl"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mibl_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
futures-util = "0.3"
sha1 = "0.10"
md-5 = "0.10"
uuid = { version = "1", features = ["v3", "v4"] }
zip = "2"
sysinfo = "0.33"
base64 = "0.22"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
